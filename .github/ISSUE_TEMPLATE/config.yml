# Every issue starts from a form (bug.yml, feature.yml, website.yml), so reports carry the
# system and version they happened on.
blank_issues_enabled: false
contact_links:
  - name: Security problem
    url: https://github.com/InoshMatheesha/MyNoX-Download-Manager
    about: Report it privately, not as an issue.
  - name: Help and questions
    url: https://github.com/InoshMatheesha/MyNoX-Download-Manager/blob/main/docs/README.md
    about: The user guide, tutorials and troubleshooting; the FAQ is at github.com/InoshMatheesha/MyNoX-Download-Manager/faq/.
