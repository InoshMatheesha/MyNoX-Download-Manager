# MyNoX Choice - MoOdY69's own theme: graphite and white neutrals, one blue accent, its own layout.

name = "MyNoX Choice"
layout = "choice"
icons = "accent"
icon-set = "metro"

[controls]
field-focus = "ring"
check = "fluent"
button = "fluent"
progress = "line"
scroll = "overlay"
caption = "metro"
focus = "ring"

[sizes]
radius = 8
"radius.button" = 8
"radius.part" = 6
"radius.check" = 5
"radius.flyout" = 12
"radius.menu-item" = 6
"radius.egui" = 8
"radius.popup" = 10
border = 1
"focus-line" = 2
"list.row" = 28
"list.header" = 30

[seeds.light]
background = "#fafafa"
surface = "#ffffff"
header = "#f4f4f5"
text = "#18181b"
accent = "#2563eb"
selection = "#e4e4e7"
error = "#c81e1e"
warning = "#8a5300"
success = "#13703a"

[seeds.dark]
background = "#09090b"
surface = "#111113"
header = "#18181b"
text = "#f4f4f5"
accent = "#60a5fa"
selection = "#2a2a2f"
error = "#f87171"
warning = "#fbbf24"
success = "#4ade80"

[light]
# The title bar and the sidebar under it: light grey, dark ink.
caption = "#f4f4f5"
"caption.text" = "#18181b"
"caption.text.inactive" = "#a1a1aa"
"caption.hot" = "#00000012"
"caption.pressed" = "#0000001c"
menubar = "#fafafa"
"menubar.bottom" = "#fafafa"
"menubar.line" = "#fafafa"
"menubar.hot" = "#ececee"
"menubar.open" = "#e4e4e7"
"selection.text" = "#18181b"
"list.grid" = "#f1f1f3"
"list.frame" = "#e4e4e7"
"progress.bar" = "#2563eb"
"progress.track" = "#e4e4e7"
"meter.fill" = "#2563eb"
"focus.ring" = "#2563eb"
# Primary buttons in near-black, the way the sidebar's Add URL is.
"button.accent" = "#18181b"
"button.accent.hot" = "#27272a"
"button.accent.pressed" = "#3f3f46"
"button.accent.bottom" = "#09090b"
"button.accent.text" = "#fafafa"
"button.accent.text.pressed" = "#fafafa"
"chip.web" = "#e0eaff"
"chip.torrent" = "#ece6ff"
"chip.text" = "#18181b"

[dark]
caption = "#0c0c0e"
"caption.text" = "#f4f4f5"
"caption.text.inactive" = "#71717a"
"caption.hot" = "#ffffff14"
"caption.pressed" = "#ffffff1f"
menubar = "#09090b"
"menubar.bottom" = "#09090b"
"menubar.line" = "#09090b"
"menubar.hot" = "#1c1c1f"
"menubar.open" = "#27272a"
"selection.text" = "#fafafa"
"list.grid" = "#1b1b1e"
"list.frame" = "#27272a"
"progress.bar" = "#60a5fa"
"progress.track" = "#27272a"
"meter.fill" = "#60a5fa"
"focus.ring" = "#60a5fa"
# Primary buttons in near-white with dark ink.
"button.accent" = "#f4f4f5"
"button.accent.hot" = "#ffffff"
"button.accent.pressed" = "#d4d4d8"
"button.accent.bottom" = "#d4d4d8"
"button.accent.text" = "#09090b"
"button.accent.text.pressed" = "#09090b"
"chip.web" = "#1a2540"
"chip.torrent" = "#251f3d"
"chip.text" = "#f4f4f5"
