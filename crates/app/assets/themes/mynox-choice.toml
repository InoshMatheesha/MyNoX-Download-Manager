# MyNoX Choice - MoOdY69's own theme: graphite and white neutrals, one blue accent, its own layout.

name = "MyNoX Choice"
layout = "choice"
icons = "accent"
icon-set = "metro"

[controls]
field-focus = "ring"
check = "fluent"
button = "fluent"
progress = "line"
scroll = "overlay"
caption = "metro"
focus = "ring"

[sizes]
radius = 8
"radius.button" = 8
"radius.part" = 6
"radius.check" = 5
"radius.flyout" = 12
"radius.menu-item" = 6
"radius.egui" = 8
"radius.popup" = 10
border = 1
"focus-line" = 2
"list.row" = 28
"list.header" = 30

[seeds.light]
background = "#fafafa"
surface = "#ffffff"
header = "#f4f4f5"
text = "#18181b"
accent = "#2563eb"
selection = "#e4e4e7"
error = "#c81e1e"
warning = "#8a5300"
success = "#13703a"

[seeds.dark]
background = "#13161b"
surface = "#191d24"
header = "#1d222a"
text = "#f2f4f7"
accent = "#60a5fa"
selection = "#243042"
error = "#f87171"
warning = "#fbbf24"
success = "#4ade80"

[light]
# The title bar and the sidebar under it: light grey, dark ink.
caption = "#f4f4f5"
"caption.text" = "#18181b"
"caption.text.inactive" = "#a1a1aa"
"caption.hot" = "#00000012"
"caption.pressed" = "#0000001c"
menubar = "#fafafa"
"menubar.bottom" = "#fafafa"
"menubar.line" = "#fafafa"
"menubar.hot" = "#ececee"
"menubar.open" = "#e4e4e7"
"selection.text" = "#18181b"
"list.grid" = "#f1f1f3"
"list.frame" = "#e4e4e7"
"progress.bar" = "#2563eb"
"progress.track" = "#e4e4e7"
"meter.fill" = "#2563eb"
"focus.ring" = "#2563eb"
# Primary buttons in near-black, the way the sidebar's Add URL is.
"button.accent" = "#18181b"
"button.accent.hot" = "#27272a"
"button.accent.pressed" = "#3f3f46"
"button.accent.bottom" = "#09090b"
"button.accent.text" = "#fafafa"
"button.accent.text.pressed" = "#fafafa"
"chip.web" = "#e0eaff"
"chip.torrent" = "#ece6ff"
"chip.text" = "#18181b"

[dark]
# Three surfaces, not pure black: the sidebar and title bar, the canvas, the cards and the list.
caption = "#0f1115"
"caption.text" = "#f2f4f7"
"caption.text.inactive" = "#6b7280"
"caption.hot" = "#ffffff14"
"caption.pressed" = "#ffffff1f"
window = "#13161b"
menubar = "#13161b"
"menubar.bottom" = "#13161b"
"menubar.line" = "#13161b"
"menubar.hot" = "#1d222a"
"menubar.open" = "#262b35"
list = "#191d24"
field = "#191d24"
header = "#1d222a"
"selection.text" = "#f8fafc"
# Crisp 1px edges round the controls, the search box and the list.
"list.frame" = "#262b35"
"list.grid" = "#20252e"
"field.border" = "#262b35"
button = "#191d24"
"button.hot" = "#20252e"
"button.pressed" = "#262b35"
"button.border" = "#262b35"
"button.bottom" = "#262b35"
"progress.bar" = "#60a5fa"
"progress.track" = "#262b35"
"meter.fill" = "#60a5fa"
"focus.ring" = "#60a5fa"
# Primary buttons in near-white with dark ink.
"button.accent" = "#f2f4f7"
"button.accent.hot" = "#ffffff"
"button.accent.pressed" = "#d4d8de"
"button.accent.bottom" = "#d4d8de"
"button.accent.text" = "#0f1115"
"button.accent.text.pressed" = "#0f1115"
"chip.web" = "#1c2a44"
"chip.torrent" = "#2a2342"
"chip.text" = "#f2f4f7"
