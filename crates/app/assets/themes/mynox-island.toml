# MyNoX Island - the second theme of MyNoX's own, beside MyNoX Choice. Technical glass: an
# instrument panel under frosted glass, in blue and graphite; the default for a new install. A Dynamic Island of live activity at the top, a floating
# dock of round buttons at the bottom, every number in a monospaced face, one blue signal colour.
# Its own layout (app/island.rs) and its own download window (progress/island.rs).

name = "MyNoX Island"
layout = "island"
icons = "accent"
icon-set = "metro"

[controls]
field-focus = "ring"
check = "fluent"
button = "fluent"
progress = "line"
scroll = "overlay"
caption = "metro"
focus = "ring"

[sizes]
radius = 10
"radius.button" = 14
"radius.part" = 8
"radius.check" = 6
"radius.flyout" = 16
"radius.menu-item" = 8
"radius.egui" = 10
"radius.popup" = 14
border = 1
"focus-line" = 2
"list.row" = 32
"list.header" = 30

[seeds.light]
background = "#e8ebf0"
surface = "#f7f8fa"
header = "#eef1f5"
text = "#121417"
accent = "#1d4ed8"
selection = "#dbe6fb"
error = "#b91c1c"
warning = "#8a5300"
success = "#166534"

[seeds.dark]
background = "#1b1e24"
surface = "#23272f"
header = "#2a2f38"
text = "#eef1f5"
accent = "#6ea1ff"
selection = "#2b3a55"
error = "#f87171"
warning = "#fbbf24"
success = "#4ade80"

[light]
# The title bar melts into the backdrop: the same cool paper grey.
caption = "#e8ebf0"
"caption.text" = "#121417"
"caption.text.inactive" = "#9aa0a8"
"caption.hot" = "#00000010"
"caption.pressed" = "#0000001a"
window = "#e8ebf0"
menubar = "#e8ebf0"
"menubar.bottom" = "#e8ebf0"
"menubar.line" = "#e8ebf0"
"menubar.hot" = "#dce0e6"
"menubar.open" = "#d2d7de"
"selection.text" = "#121417"
"list.grid" = "#eceef2"
"list.frame" = "#d9dde3"
"progress.bar" = "#2563eb"
"progress.track" = "#d9dde3"
"meter.fill" = "#2563eb"
"focus.ring" = "#2563eb"
# The signal colour is also the primary button: blue with white ink.
"button.accent" = "#2563eb"
"button.accent.hot" = "#3b74f0"
"button.accent.pressed" = "#1d4ed8"
"button.accent.bottom" = "#1d4ed8"
"button.accent.text" = "#ffffff"
"button.accent.text.pressed" = "#ffffff"
"chip.web" = "#e3e7ed"
"chip.torrent" = "#dde7fa"
"chip.text" = "#121417"

[dark]
# Graphite, not black, in three depths: the backdrop, the card, the header row.
caption = "#1b1e24"
"caption.text" = "#eef1f5"
"caption.text.inactive" = "#7a818c"
"caption.hot" = "#ffffff12"
"caption.pressed" = "#ffffff1f"
window = "#1b1e24"
menubar = "#1b1e24"
"menubar.bottom" = "#1b1e24"
"menubar.line" = "#1b1e24"
"menubar.hot" = "#262a32"
"menubar.open" = "#2e333c"
list = "#23272f"
field = "#262a33"
header = "#2a2f38"
"selection.text" = "#f8fafc"
"list.frame" = "#343a45"
"list.grid" = "#2b3039"
"field.border" = "#343a45"
button = "#262a33"
"button.hot" = "#2e333d"
"button.pressed" = "#363c47"
"button.border" = "#343a45"
"button.bottom" = "#343a45"
"progress.bar" = "#6ea1ff"
"progress.track" = "#343a45"
"meter.fill" = "#6ea1ff"
"focus.ring" = "#6ea1ff"
# Blue with white ink.
"button.accent" = "#2563eb"
